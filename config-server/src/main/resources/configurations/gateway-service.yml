server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: containers-service
          uri: lb://containers-service
          predicates:
            - Path=/api/containers/**
          filters:
            - StripPrefix=2

        - id: logistics-service
          uri: lb://logistics-service
          predicates:
            - Path=/api/logistics/**
          filters:
            - StripPrefix=2

        - id: accounting-service
          uri: lb://accounting-service
          predicates:
            - Path=/api/accounting/**
          filters:
            - StripPrefix=2

        - id: users-service
          uri: lb://users-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=2

logging:
  level:
    org.springframework.cloud.gateway: DEBUG